services:
  - type: web
    name: we-learn-greek-api
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn we_learn_greek.wsgi --log-file -"
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.5
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
